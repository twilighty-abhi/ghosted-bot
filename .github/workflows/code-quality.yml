name: Code Quality Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality-check:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci

    - name: Global Syntax Check
      run: |
        echo "Performing basic syntax checks on all JavaScript files..."
        find . -name "*.js" -not -path "./node_modules/*" -exec node --check {} +
        echo "✅ Syntax OK"

    # NOTE: Uncomment and use the steps below once you configure a testing/linter framework
